<style>
:root{color-scheme:dark;--bg:#11121b;--panel:#1b1d2b;--line:#34364b;--muted:#a9adc2;--accent:#a99aff;--text:#f5f5ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:760px;margin:auto;padding:14px}h1{margin:4px 0;font-size:24px}h1 span{color:var(--accent)}

</style></head><body><main class="app">
<h1>Chat <span>LLM</span></h1><div class="s">Free AI models · no sign-in · automatic fallback</div>
<nav class="tabs" id="tabs"><button data-m="chat" class="on">Chat</button><button data-m="route">Smart</button><button data-m="team">Team</button><button data-m="compare">Compare</button></nav>
<div class="row" id="pick"><select id="model"></select><button id="clear">New chat</button></div>
<div class="row hide" id="multi"></div>
<textarea id="prompt" placeholder="Ask anything…"></textarea>
<div class="row"><button class="send" id="send">Send</button></div>
<div id="out"></div>
<details><summary>Add Groq (free key)</summary>
<p>Get a free key at console.groq.com. It stays on this phone only. Paste, then reload the page.</p>
<input id="groqkey" placeholder="Groq key (free)" type="password" style="width:100%;margin-bottom:8px">
<input id="optkey" placeholder="Optional Pollinations key" type="password" style="width:100%"></details>
</main><script>// Chat LLM — keyless, backend-free. Runs entirely in the browser/phone.
const ENDPOINTS = [
  "https://text.pollinations.ai/openai/chat/completions",
  "https://gen.pollinations.ai/v1/chat/completions"
];
const DEFAULT_MODELS = ["openai", "mistral", "gemini-fast", "deepseek", "qwen-coder"];
const store = (typeof localStorage !== "undefined") ? localStorage : { getItem: () => null, setItem() {}, removeItem() {} };

async function callOne(endpoint, model, messages) {
  const key = store.getItem("optkey");
  const headers = { "Content-Type": "application/json" };
  if (key) headers.Authorization = "Bearer " + key;
  const r = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify({ model, messages }), signal: AbortSignal.timeout(90000) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((d.error && (d.error.message || d.error)) || ("HTTP " + r.status));
  const t = d.choices?.[0]?.message?.content;
  if (!t) throw new Error("Empty reply");
  return t;
}
// One model, tried on every endpoint.
async function callGroq(model, messages) {
  const r = await fetch("https://api.groq.com/openai/v1/chat/completions", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + store.getItem("groqkey") }, body: JSON.stringify({ model, messages }), signal: AbortSignal.timeout(90000) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((d.error && d.error.message) || ("HTTP " + r.status));
  const t = d.choices?.[0]?.message?.content; if (!t) throw new Error("Empty reply"); return t;
}
async function askModel(model, messages) {
  if (model.startsWith("groq:")) return callGroq(model.slice(5), messages);
  const errs = [];
  for (const ep of ENDPOINTS) {
    try { return await callOne(ep, model, messages); }
    catch (e) { errs.push(new URL(ep).host + ": " + e.message); }
  }
  throw new Error(model + " failed (" + errs.join("; ") + ")");
}
// Preferred model first, then every other model, until one works.
async function askAuto(preferred, models, messages) {
  const order = [...new Set([preferred, ...models].filter(Boolean))], errs = [];
  for (const m of order) {
    try { return { model: m, text: await askModel(m, messages), fallback: errs.length > 0, errors: errs }; }
    catch (e) { errs.push(e.message); }
  }
  throw new Error("No free model answered right now.\n" + errs.join("\n"));
}
function smartPick(prompt, models) {
  const p = prompt.toLowerCase();
  let want = "openai";
  if (/\b(code|function|bug|python|javascript|java|kotlin|html|css|sql|regex|script|compile|error)\b/.test(p)) want = "qwen-coder";
  else if (/\b(prove|math|solve|calculate|equation|reason|step by step|logic|puzzle)\b/.test(p)) want = "deepseek";
  else if (prompt.length < 120) want = "gemini-fast";
  return models.includes(want) ? want : models[0];
}
async function compare(models, allModels, prompt) {
  const msgs = [{ role: "user", content: "Answer independently. State assumptions and uncertainty.\n\n" + prompt }];
  const res = await Promise.allSettled(models.map(async m => ({ model: m, text: await askModel(m, msgs) })));
  const answers = res.filter(x => x.status === "fulfilled").map(x => x.value);
  const errors = res.filter(x => x.status === "rejected").map(x => x.reason.message);
  // Backup: if some failed, top up from unused models so you still get several answers.
  const spare = allModels.filter(m => !models.includes(m));
  for (let i = 0; answers.length < Math.min(models.length, 2) && i < spare.length; i++) {
    try { answers.push({ model: spare[i] + " (backup)", text: await askModel(spare[i], msgs) }); } catch (e) { errors.push(e.message); }
  }
  return { answers, errors };
}
async function cooperate(models, allModels, prompt) {
  const { answers, errors } = await compare(models, allModels, prompt);
  if (!answers.length) throw new Error("No model answered.\n" + errors.join("\n"));
  const synthPrompt = "Combine these candidate answers into one accurate, useful response. Point out disagreements and uncertainty.\n\nQuestion: " + prompt + "\n\n" +
    answers.map(a => a.model + ":\n" + a.text).join("\n\n---\n\n");
  let final = null;
  try { final = await askAuto(answers[0].model.replace(" (backup)", ""), allModels, [{ role: "user", content: synthPrompt }]); } catch (e) { errors.push("Combining failed: " + e.message); }
  return { answers, errors, final };
}
async function extraModels() {
  const out = [];
  const g = store.getItem("groqkey");
  if (g) {
    let name = "llama-3.3-70b-versatile";
    try {
      const r = await fetch("https://api.groq.com/openai/v1/models", { headers: { Authorization: "Bearer " + g }, signal: AbortSignal.timeout(8000) });
      const ids = (await r.json()).data.map(m => m.id).filter(id => !/whisper|tts|guard|embed/i.test(id));
      name = ids.find(id => /llama.*70b/i.test(id)) || ids[0] || name;
    } catch {}
    out.push("groq:" + name);
  }
  return out;
}
async function loadModels() {
  try {
    const r = await fetch("https://text.pollinations.ai/models", { signal: AbortSignal.timeout(8000) });
    const d = await r.json();
    const names = d.filter(m => !m.tier || m.tier === "anonymous" || m.tier === "seed" || m.tier === "free").filter(m => !/audio|vision-only/.test(m.name || "")).map(m => m.name).filter(Boolean);
    if (names.length >= 2) return [...await extraModels(), ...names.slice(0, 12)];
  } catch {}
  return [...await extraModels(), ...DEFAULT_MODELS];
}

</script><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const card=(t,b,c="")=>`<div class="card ${c}"><div class="t">${esc(t)}</div>${esc(b)}</div>`;
let mode="chat",models=DEFAULT_MODELS,hist=JSON.parse(localStorage.getItem("hist")||"[]");
const saveHist=()=>localStorage.setItem("hist",JSON.stringify(hist.slice(-24)));
function renderHist(){$("#out").innerHTML=hist.map(m=>m.role==="user"?card("You",m.content,"u"):card(m.model||"AI",m.content)).reverse().join("")}
function setModels(){$("#model").innerHTML='<option value="">Automatic (best available)</option>'+models.map(m=>`<option>${m}</option>`).join("");
$("#multi").innerHTML=models.slice(0,8).map((m,i)=>`<label><input type="checkbox" value="${m}" ${i<3?"checked":""}>${m}</label>`).join("")}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;[...$("#tabs").children].forEach(x=>x.classList.toggle("on",x===b));
$("#pick").classList.toggle("hide",mode!=="chat");$("#multi").classList.toggle("hide",!["team","compare"].includes(mode));if(mode==="chat")renderHist();else $("#out").innerHTML=""};
$("#clear").onclick=()=>{hist=[];saveHist();renderHist()};
["optkey","groqkey"].forEach(k=>{const el=$("#"+k);el.value=localStorage.getItem(k)||"";el.onchange=e=>{const v=e.target.value.trim();v?localStorage.setItem(k,v):localStorage.removeItem(k);loadModels().then(m=>{models=m;setModels()})}});
$("#send").onclick=async()=>{const prompt=$("#prompt").value.trim();if(!prompt)return;$("#send").disabled=true;
 const show=h=>$("#out").innerHTML=h;show(card("Working…","Trying free models. This can take a few seconds."));
 try{
  if(mode==="chat"||mode==="route"){
   const pref=mode==="route"?smartPick(prompt,models):$("#model").value;
   const msgs=mode==="chat"?[...hist.map(({role,content})=>({role,content})),{role:"user",content:prompt}]:[{role:"user",content:prompt}];
   const r=await askAuto(pref,models,msgs);
   if(mode==="chat"){hist.push({role:"user",content:prompt},{role:"assistant",content:r.text,model:r.model+(r.fallback?" (fallback)":"")});saveHist();renderHist()}
   else show(card(r.model+(r.fallback?" (fallback)":""),r.text));
  }else{
   const sel=[...document.querySelectorAll("#multi input:checked")].map(x=>x.value);if(!sel.length)throw Error("Tick at least one model.");
   if(mode==="compare"){const r=await compare(sel,models,prompt);show(r.answers.map(a=>card(a.model,a.text)).join("")+(r.errors.length?card("Unavailable",r.errors.join("\n"),"err"):""))}
   else{const r=await cooperate(sel,models,prompt);show((r.final?card("Combined answer · "+r.final.model,r.final.text):"")+r.answers.map(a=>card(a.model,a.text)).join("")+(r.errors.length?card("Unavailable",r.errors.join("\n"),"err"):""))}
  }$("#prompt").value="";
 }catch(e){show(card("Couldn't get an answer",e.message,"err"))}finally{$("#send").disabled=false}};
loadModels().then(m=>{models=m;setModels()});setModels();if(mode==="chat")renderHist();
</script></body></html>
